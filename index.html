<div class="card"><b>💸 Update a live fare</b><label>From</label><select id="fa">${opt("lifecamp")}</select><label>To</label><select id="fb">${opt("garki")}</select><label>Transport</label><select id="fm">${mop}</select><label>Fare you paid (₦)</label><input id="fv" type="number" inputmode="numeric"><div style="margin-top:10px"><button class="p" onclick="postF()">Submit fare</button></div></div>
<div class="card"><b>🛣️ Suggest a new route</b><div class="mu">Know a way that is not listed? Add one leg. Routes show as unverified until ${TH} riders confirm.</div><label>From</label><select id="ra">${opt("lifecamp")}</select><label>To</label><select id="rb">${opt("lungu")}</select><label>Transport</label><select id="rm">${mop}</select><label>Fare (₦)</label><input id="rf" type="number" inputmode="numeric"><label>Directions (optional)</label><input id="rd" maxlength="120" placeholder="e.g. Cross the flyover first"><div style="margin-top:10px"><button class="p" onclick="postO()">Suggest route</button></div></div>
<div class="card"><b>📣 Report or correct something</b><div class="mu">Moved park, wrong stop, one-chance alert? Reports are reviewed and used to update stops and routes.</div><label>Where</label><select id="rp">${opt("wuse")}</select><label>What</label><select id="rk">${K.map(k=>`<option>${k}</option>`).join("")}</select><label>Note</label><input id="rn" maxlength="120" placeholder="e.g. Lifecamp park now loads near the flyover"><div style="margin-top:10px"><button class="p" onclick="postR()">Post</button></div></div><b>Latest fare updates</b>`;
const fs=lst("fares").filter(x=>okK(x.k)).slice(0,10);if(!fs.length)h+=`<div class="card mu">No fare updates yet.</div>`;
fs.forEach(x=>{const p=x.k.split("~");h+=`<div class="card"><b>${MD[p[2]].ic} ${N(x.a)}</b> · ${esc(P[p[0]][0])} ↔ ${esc(P[p[1]][0])}<div class="mu">${ago(x.ts)}</div></div>`});
h+=`<b>Latest reports</b>`;const rs=lst("reports").filter(r=>P[r.p]).slice(0,20);if(!rs.length)h+=`<div class="card mu">No reports yet.</div>`;
rs.forEach(r=>h+=`<div class="card"><b>${esc(r.k)}</b> · ${esc(P[r.p][0])}<div class="mu">${ago(r.ts)}${r.n?" · "+esc(r.n):""}</div></div>`);return h}
function postF(){const a=$("#fa").value,b=$("#fb").value,m=$("#fm").value,v=Math.round(+$("#fv").value);if(a===b||!(v>0&&v<500000)){S.msg="Pick two different places and enter the fare.";return R()}const k=ck(a,b,m);put("fares",{k,a:v,ts:Date.now()},x=>x.k===k)}
function postO(){const a=$("#ra").value,b=$("#rb").value,m=$("#rm").value,f=Math.round(+$("#rf").value);if(a===b||!(f>0&&f<500000)){S.msg="Pick two different places and enter the fare.";return R()}const k=ck(a,b,m);put("routes",{a,b,m,f,note:$("#rd").value.trim().slice(0,120),ts:Date.now()},x=>ck(x.a,x.b,x.m)===k)}
function postR(){put("reports",{p:$("#rp").value,k:$("#rk").value,n:$("#rn").value.trim().slice(0,120),ts:Date.now()})}
const nz=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
async function chk(){const v=nz($("#pl").value);S.pr=null;A=1;if(v.length<5){S.pr={s:"bad"};return R()}if(!DB){S.pr={s:"off"};return R()}try{const r=await DB.doc("plates/"+v.slice(0,3)).get(),m=(r.data()||{}).p||{};S.pr=m[v]?{s:"ok",v,src:m[v]}:{s:"no",v}}catch(e){S.pr={s:"off"}}R()}
async function imp(){const g={};$("#im").value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(l=>{const q=l.split(","),v=nz(q[0]||"");if(v.length>=5)(g[v.slice(0,3)]=g[v.slice(0,3)]||{})[v]=(q[1]||"Official registry").trim().slice(0,40)});let n=0;try{for(const k in g){const r=await DB.doc("plates/"+k).get();await DB.doc("plates/"+k).set({p:{...((r.data()||{}).p||{}),...g[k]}});n+=Object.keys(g[k]).length}S.pm="Imported "+n+" plates."}catch(e){S.pm="Import stopped after "+n+" plates."}R()}
function verify(){const r=S.pr;let h=`<div class="card"><b>✅ Check a vehicle plate</b><div class="mu">Enter the plate number to see if the vehicle is in our registry of roadworthy vehicles from Road Safety (FRSC) and VIO records.</div><label>Plate number</label><input id="pl" placeholder="e.g. ABC 123 XY" autocapitalize="characters" value="${r&&r.v?esc(r.v):""}"><div style="margin-top:10px"><button class="p" onclick="chk()">Check plate</button></div></div>`;
if(r)h+=r.s==="ok"?`<div class="card res"><div class="ic" style="color:var(--ok)">✅</div><br><b style="color:var(--ok);font-size:20px">Verified</b><div>${esc(r.v)} is in the registry.</div><div class="mu">Source: ${esc(r.src)}</div></div>`:r.s==="no"?`<div class="card res"><div class="ic">❔</div><br><b>Not found in our registry</b><div class="mu">${esc(r.v)} is not in our database yet. This does not mean the vehicle is unsafe. Ask to see the papers, or check with FRSC or VIO.</div></div>`:r.s==="bad"?`<div class="warn">Enter the full plate number.</div>`:`<div class="warn">Verification is unavailable right now.</div>`;
h+=`<div class="warn">A green check appears only for plates in official data supplied to Go Commute. It does not prove the driver is genuine, so also match the car colour, model and the driver. Never board a vehicle that feels wrong.</div>`;
if(OWN)h+=`<div class="card"><b>Import registry (owner only)</b><div class="mu">Paste official plates, one per line, optionally "PLATE,source". Use only data supplied by FRSC or FCT VIO.</div><textarea id="im" rows="5"></textarea><div style="margin-top:10px"><button class="p" onclick="imp()">Import</button></div>${S.pm?`<div class="mu">${esc(S.pm)}</div>`:""}</div>`;return h}
function saved(){if(!S.sav.length)return`<div class="card mu">No saved trips yet. Tap Save trip on the Home tab.</div>`;return S.sav.map((s,i)=>`<div class="card rt"><b>${esc(P[s.f][0])} → ${esc(P[s.t][0])}</b><div><button class="p" onclick="S.from='${s.f}';S.to='${s.t}';S.hl=null;S.tab='plan';A=1;R()">Go</button> <button onclick="S.sav.splice(${i},1);ls.set('gc_s',S.sav);R()" aria-label="Remove">✕</button></div></div>`).join("")}
function more(){const C=["Lagos","Port Harcourt","Kano","Ibadan","Kaduna","Enugu","Benin City","Jos"];return`${OWN?review():""}<div class="card"><b>Abuja</b> <span class="tag">Live prototype</span><div class="mu">${IDS.length} places, 6 ways to travel, live fares, rider routes and plate check.</div></div><div class="card"><b>How accuracy works</b><div class="mu">Fares use the middle value of recent rider updates, ignoring wild outliers once 3 or more riders report. New routes stay marked unverified until ${TH} different riders confirm them. Stop and route reports are reviewed by the Go Commute team.</div></div><div class="card"><b>Official transit maps</b><div class="mu">Abuja Metro, FCT bus and rail maps will be added once the operators give permission.</div></div><b>Vote for the next city</b>`+C.map(c=>`<div class="card rt"><div><b>${c}</b><div class="mu">${S.vote[c]||0} on this device</div></div><button onclick="S.vote['${c}']=(S.vote['${c}']||0)+1;ls.set('gc_v',S.vote);R()">▲ Vote</button></div>`).join("")}
async function rm(n,u,ts){if(!DB)return;try{await DB.doc(n+"/"+u).set({items:SH[n].filter(x=>x.u===u&&x.ts!==ts).map(({u:_,...x})=>x)})}catch(e){S.msg="Could not remove.";R()}}
function review(){const q=SH.reports.filter(r=>["Park/stop moved","Route wrong","Fare changed","One-chance alert"].includes(r.k)),us=allE().filter(e=>e[5]==="crowd"&&e[6]<TH);return`<div class="card"><b>🛠️ Review queue (owner only)</b><div class="mu">Check each item, update the data, then remove it.</div>${q.length?q.slice(0,15).map(r=>`<div style="padding:8px 0;border-top:1px dashed var(--bd)"><b>${esc(r.k)}</b> · ${esc(P[r.p][0])}<div class="mu">${esc(r.n||"")} · ${ago(r.ts)}</div><button onclick="rm('reports','${r.u}',${r.ts})">Remove</button></div>`).join(""):`<div class="mu">No reports waiting.</div>`}${us.length?`<div class="mu" style="margin-top:8px"><b>Unverified routes</b></div>`+us.map(e=>`<div class="mu">${MD[e[2]].ic} ${esc(P[e[0]][0])} → ${esc(P[e[1]][0])} · ${N(e[3])} · ${e[6]}/${TH} confirmations</div>`).join(""):""}</div>`}
const T=[["plan","home","Home"],["live","update","Update"],["verify","verify","Verify"],["saved","star","Saved"],["more","more","More"]];
function cnt(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/800);e.textContent=e.dataset.p+N(n*(1-Math.pow(1-k,3)))+e.dataset.s;if(k<1)requestAnimationFrame(f)})(t0)})}
function R(){const an=A;A=0;ANIM=an;const a=$("#app");a.className="wrap"+(an?" anim":"");a.innerHTML={plan,live,verify,saved,more}[S.tab]();S.sp=0;$("#nav").innerHTML=T.map(t=>`<button class="${S.tab===t[0]?"on":""}" aria-label="${t[2]}" ${S.tab===t[0]?'aria-current="page"':""} onclick="S.tab='${t[0]}';S.ok=null;A=1;R();scrollTo({top:0})">${svgi(t[1])}${t[2]}</button>`).join("");if(S.tab==="plan"){draw();if(an)cnt()}else S.ok=null;renderSheet()}
let c="";for(let i=2;i<=16;i++)c+=`.anim>*:nth-child(${i}){animation-delay:${(i-1)*.05}s}`;document.head.appendChild(Object.assign(document.createElement("style"),{textContent:c}));
calcLF();R();
(async()=>{try{const [u,d]=await Promise.all([claude.use("user"),claude.use("db")]);if(!u||!d)return;UID=await u.id();OWN=!!u.isOwner();DB=d;
["reports","fares","routes"].forEach(n=>d.collection(n).onSnapshot(s=>{const o=[];s.docs.forEach(x=>{const it=(x.data()||{}).items;if(Array.isArray(it))it.forEach(i=>{if(i&&+i.ts&&(n==="fares"?okK(i.k)&&+i.a>0:n==="routes"?P[i.a]&&P[i.b]&&MD[i.m]&&+i.f>0:P[i.p]))o.push({...i,ts:+i.ts,u:x.id})})});o.sort((a,b)=>b.ts-a.ts);SH[n]=o;calcLF();if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))R()},()=>{DB=null;R()}))}catch(e){}})();
</script></body></html>
