<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GO-ASSIST · Abuja transit guide</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#10201a;--mu:#5b6b64;--ac:#0b7a4b;--ac2:#e3f3ea;--bd:#dce5e0;--wa:#a8540a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17201c;--tx:#e8f0ec;--mu:#9aaba3;--ac:#3ecf8e;--ac2:#14301f;--bd:#2a3730;--wa:#f0a64a;--on:#06140d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#17201c;--tx:#e8f0ec;--mu:#9aaba3;--ac:#3ecf8e;--ac2:#14301f;--bd:#2a3730;--wa:#f0a64a;--on:#06140d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{padding:16px 16px 4px;max-width:560px;margin:auto}
h1{margin:0;font-size:22px;letter-spacing:.5px}h1 b{color:var(--ac)}
.sub{color:var(--mu);font-size:13px}
main{max-width:560px;margin:auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
label{font-size:12px;color:var(--mu);display:block;margin:6px 0 2px}
select,input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 12px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;border-radius:99px;padding:6px 12px}
.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:20px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 4px 0 0}
.warn{background:var(--ac2);border-left:4px solid var(--wa);padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0}
ol{padding-left:20px;margin:8px 0}li{margin:3px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);padding:6px 2px}nav button span{display:block;font-size:19px}
nav button.on{color:var(--ac);font-weight:700}
svg{width:100%;height:auto;display:block;background:var(--ac2);border-radius:12px}
.wrap{overflow-x:auto}
</style></head><body>
<header><h1>GO<b>-</b>ASSIST</h1><div class="sub">City transit guide for Nigeria · Abuja first</div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const P={central:["Central Area",9.056,7.490,1],garki:["Garki",9.033,7.489,0],wuse:["Wuse Market",9.068,7.469,0],maitama:["Maitama",9.090,7.493,0],asokoro:["Asokoro",9.039,7.525,0],berger:["Berger Junction",9.058,7.456,0],utako:["Utako",9.068,7.442,0],jabi:["Jabi Lake",9.069,7.425,0],gwarinpa:["Gwarinpa",9.111,7.410,0],kubwa:["Kubwa",9.155,7.330,0],nyanya:["Nyanya",9.043,7.580,0],lugbe:["Lugbe",8.978,7.388,0],idu:["Idu Station",9.063,7.380,1],airport:["Nnamdi Azikiwe Airport",9.007,7.263,1],karu:["Karu",9.020,7.597,0],apo:["Apo",8.998,7.505,0],gwagwalada:["Gwagwalada",8.944,7.080,0],kuje:["Kuje",8.880,7.240,0],zuba:["Zuba",9.120,7.200,0]};
const B={central:["Central Area bus stops along Ahmadu Bello Way","Central Area bus stop, then walk to your office","Taxi stands around the Central Business District, or book ride-hail"],garki:["Area 1 Park (Garki), the hub for Nyanya, Kubwa, Gwagwalada and Zuba routes","Area 1 Park or the nearest Garki bus stop","Taxis near Garki Market, or book ride-hail"],wuse:["Wuse Market bus stops","Wuse Market bus stop","Cabs along the market roads, or book ride-hail"],maitama:["Main-road bus stops in Maitama (few parks here)","Nearest main-road bus stop","Mostly cabs and ride-hail, so book ahead"],asokoro:["Main-road bus stops in Asokoro (few parks here)","Nearest main-road bus stop","Mostly cabs and ride-hail, so book ahead"],berger:["Berger bus stop, a major hub for Lugbe, Suleja and Kuje routes","Berger bus stop","Cabs around the junction, or book ride-hail"],utako:["Utako Park (also used for interstate travel)","Utako Park or the Utako bus stop","Cabs near the park, or book ride-hail"],jabi:["Jabi Park","Jabi Park or the Jabi bus stop","Cabs near Jabi Lake Mall, or book ride-hail"],gwarinpa:["Main avenue bus stops; keke is common inside the estates","Nearest main-road stop, then keke","Keke and cabs on the avenues, or book ride-hail"],kubwa:["Kubwa bus stops along the expressway","Kubwa bus stop","Cabs at the main junctions, or book ride-hail"],nyanya:["Nyanya Bus Terminal","Nyanya Bus Terminal","Cabs near the terminal, or book ride-hail"],lugbe:["Lugbe bus stops on the airport road; keke inside the district","Lugbe bus stop","Cabs on the airport road, or book ride-hail"],idu:["Idu station area; bus and taxi connections nearby","Idu station","Taxis at the station, or book ride-hail"],airport:["City buses along the airport road","Airport terminal drop-off","Airport taxi rank (usually pricier than city taxis), or book ride-hail"],karu:["Karu bus stops along the Abuja–Keffi road","Karu bus stop","Cabs at the main junction, or book ride-hail"],apo:["Apo main-road bus stops; keke inside the districts","Nearest Apo bus stop","Keke and cabs, or book ride-hail"],gwagwalada:["Gwagwalada Park","Gwagwalada Park","Cabs near the park, or book ride-hail"],kuje:["Kuje bus stops and park","Kuje bus stop","Cabs at the main junction, or book ride-hail"],zuba:["Zuba bus stops on the Abuja–Kaduna road","Zuba bus stop","Cabs at the junction, or book ride-hail"]};
let DB=null,UID=null,SH=[];function allRep(){return DB?SH:S.rep}
const IDS=Object.keys(P),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={tab:"plan",from:"wuse",to:"airport",mode:"all",open:null,rep:ls.get("ga_r",[]),sav:ls.get("ga_s",[]),vote:ls.get("ga_v",{})};
const rad=x=>x*Math.PI/180;
function hav(a,b){const R=6371,dl=rad(b[1]-a[1]),dn=rad(b[2]-a[2]),h=Math.sin(dl/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const rn=(x,n)=>Math.round(x/n)*n,N=x=>"₦"+x.toLocaleString("en-NG");
function routes(f,t){const a=P[f],b=P[t],g=hav(a,b),d=g*1.3,r=[];
r.push({m:"walk",ic:"🚶",n:"Walk",min:d/5*60,fare:"Free",kcal:d*55,co:d*.17,d,steps:[`Start at ${a[0]} and follow the main pedestrian routes towards ${b[0]}`,`About ${d.toFixed(1)} km on foot`,`Arrive at ${b[0]}`]});
if(d<=15)r.push({m:"bike",ic:"🚲",n:"Bike",min:d/15*60,fare:"Free",kcal:d*30,co:d*.17,d,steps:[`Pick up your bike at ${a[0]}`,`Ride about ${d.toFixed(1)} km, using service roads and cycle-friendly streets where possible`,`Arrive at ${b[0]}`]});
const bm=8+d/18*60;r.push({m:"bus",ic:"🚌",n:"Bus / minibus",min:bm,fare:"",kcal:d*4,co:d*.17,d,steps:[`Go to: ${B[f][0]}`,`Board a bus or minibus heading towards ${b[0]}, or the nearest hub, and confirm the destination with the conductor`,`Ride about ${Math.round(bm-8)} min`,`Get off at: ${B[t][1]}`]});
const tf=1000+280*d;r.push({m:"taxi",ic:"🚕",n:"Taxi / ride-hail",min:5+d/25*60,fare:N(rn(tf*.85,100))+"–"+N(rn(tf*1.25,100)),kcal:0,co:0,d,steps:[`Book a ride (Bolt, Uber, inDrive) or flag a taxi: ${B[f][2]}`,`Agree the fare before you start if it is not metered`,`About ${d.toFixed(1)} km to ${b[0]}`]});
if(a[3]&&b[3]&&f!==t){const dd=g,m=20+dd/50*60;r.push({m:"train",ic:"🚆",n:"Train (Abuja Metro)",min:m,fare:"Check operator",kcal:12,co:d*.17,d:dd,steps:[`Walk into the ${a[0]} rail station`,`Board the train towards ${b[0]}`,`Ride about ${Math.round(dd/50*60)} min`,`Exit at ${b[0]} and walk to your destination`]})}
return r.sort((x,y)=>x.min-y.min)}
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const opt=(sel)=>IDS.map(i=>`<option value="${i}" ${i===sel?"selected":""}>${P[i][0]}</option>`).join("");
const X=p=>((p[2]-7.05)*630).toFixed(0),Y=p=>((9.17-p[1])*630+10).toFixed(0);
function map(f,t){let s=`<svg viewBox="0 0 360 215" role="img" aria-label="Schematic map of Abuja">`;
IDS.forEach(i=>{const p=P[i];s+=`<circle cx="${X(p)}" cy="${Y(p)}" r="${p[3]?5:3}" fill="${p[3]?"none":"var(--mu)"}" stroke="${p[3]?"var(--wa)":"none"}" stroke-width="2"/><text x="${+X(p)+(+X(p)>270?-6:6)}" y="${+Y(p)+3}" text-anchor="${+X(p)>270?"end":"start"}" font-size="7" fill="var(--mu)">${esc(p[0])}</text>`});
if(f&&t){const a=P[f],b=P[t];s+=`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="var(--ac)" stroke-width="3" stroke-dasharray="6 4"/><circle cx="${X(a)}" cy="${Y(a)}" r="6" fill="var(--ac)"/><circle cx="${X(b)}" cy="${Y(b)}" r="6" fill="var(--wa)"/>`}
return s+`</svg><div class="mu">Schematic only, not to scale. Rings mark rail stations.</div>`}
function plan(){const rs=routes(S.from,S.to).filter(r=>S.mode==="all"||r.m===S.mode);
const M=[["all","All"],["walk","🚶 Walk"],["bike","🚲 Bike"],["bus","🚌 Bus"],["taxi","🚕 Taxi"],["train","🚆 Train"]];
const rec=allRep().filter(r=>Date.now()-r.ts<10800000&&(r.p===S.from||r.p===S.to));
let h=`<div class="card"><label>From</label><select onchange="S.from=this.value;S.open=null;R()">${opt(S.from)}</select><div style="text-align:center"><button onclick="let x=S.from;S.from=S.to;S.to=x;R()" aria-label="Swap">⇅ Swap</button></div><label>To</label><select onchange="S.to=this.value;S.open=null;R()">${opt(S.to)}</select></div>
<div class="chips">${M.map(m=>`<button class="${S.mode===m[0]?"on":""}" onclick="S.mode='${m[0]}';R()">${m[1]}</button>`).join("")}</div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${S.hops?"checked":""} onchange="S.hops=this.checked;R()">Include keke/okada hops at both ends</label><div class="warn">Fares are typical ranges based on 2026 press reports and move with fuel prices. Always confirm with the driver before you start.</div>`;
if(rec.length)h+=`<div class="warn">🔴 ${rec.length} rider report${rec.length>1?"s":""} near your trip in the last 3 hours. Latest: ${esc(rec[0].k)} at ${esc(P[rec[0].p][0])} (${ago(rec[0].ts)})</div>`;
h+=map(S.from,S.to);
if(S.from===S.to)return h+`<div class="card">Pick two different places.</div>`;
rs.forEach((r,i)=>{const k=r.m+S.from+S.to,o=S.open===k;h+=`<div class="card"><div class="rt" onclick="S.open=${o?"null":`'${k}'`};R()"><div><div>${r.ic} <b>${r.n}</b>${i===0&&S.mode==="all"?' <span class="tag">Fastest</span>':""}</div><div class="mu">${fareTxt(r)}</div></div><div class="big">${Math.round(r.min)} min</div></div>`;
if(o)h+=extra(r)+`<ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><span class="tag">🔥 ${Math.round(r.kcal)} kcal</span><span class="tag">🌱 saves ${r.co.toFixed(1)} kg CO₂ vs driving</span><div style="margin-top:8px"><button class="p" onclick="save('${r.m}')">★ Save trip</button></div>`;
h+=`</div>`});
return h}
function cost(r){const d=r.d;if(r.m==="bus"){const f=150+45*Math.min(d,20)+25*Math.max(0,d-20);return[rn(f*.85,50),rn(f*1.15+(d>10?400:0),50)]}if(r.m==="taxi"){const f=1000+280*d;return[rn(f*.85,100),rn(f*1.25,100)]}return r.m==="train"?null:[0,0]}
function fareTxt(r){const c=cost(r);return c?(c[1]?N(c[0])+"–"+N(c[1]):"Free"):"Fare: check operator"}
function extra(r){const f=P[S.from],t=P[S.to],c=cost(r),bs=r.m==="bus",tx=r.m==="taxi";let h=`<div class="warn">`;
if(bs||tx)h+=`📍 <b>Board:</b> ${esc(bs?B[S.from][0]:B[S.from][2])}<br>🛑 <b>Stop:</b> ${esc(bs?B[S.to][1]:"Ask the driver to drop you at "+t[0])}`;
else if(r.m==="train")h+=`📍 <b>Board:</b> ${esc(f[0])} station<br>🛑 <b>Stop:</b> ${esc(t[0])} station`;
else h+=`📍 Start: ${esc(f[0])}<br>🛑 Finish: ${esc(t[0])}`;
h+=`<div class="mu">Typical spots. Confirm on arrival, and post corrections on the Live tab.</div></div>`;
if(c&&c[1]){const h0=S.hops?200:0,h1=S.hops?600:0;h+=`<div class="card" style="margin:6px 0"><div class="rt"><span>${bs?"Bus fare":"Ride fare"}</span><span>${N(c[0])}–${N(c[1])}</span></div>${S.hops?`<div class="rt"><span>Keke/okada hops</span><span>${N(h0)}–${N(h1)}</span></div>`:""}<div class="rt"><b>Total trip</b><b>${N(c[0]+h0)}–${N(c[1]+h1)}</b></div>${bs&&r.d>10?`<div class="mu">High end allows for one transfer. Some FCT routes on CNG buses are reported to charge about 40% less.</div>`:""}</div>`}
return h}
function save(m){if(!S.sav.some(s=>s.f===S.from&&s.t===S.to&&s.m===m)){S.sav.unshift({f:S.from,t:S.to,m});ls.set("ga_s",S.sav)}S.tab="saved";R()}
function live(){let h=`<div class="card"><b>Report what you see</b><div class="mu">${DB?"Reports are shared with all riders.":"Shared board unavailable, so reports stay on this device."}</div>${S.msg?`<div class="warn">${esc(S.msg)}</div>`:""}<label>Where</label><select id="rp">${opt("wuse")}</select><label>What</label><select id="rk"><option>Delay</option><option>Crowded</option><option>Fare change</option><option>Road blocked</option><option>All clear</option><option>Cab/park location</option></select><label>Note (optional)</label><input id="rn" maxlength="120" placeholder="e.g. long queue for Nyanya buses"><div style="margin-top:8px"><button class="p" onclick="post()">Post report</button></div></div><b>Latest reports</b>`;
if(!allRep().length)h+=`<div class="card mu">No reports yet. Be the first.</div>`;
allRep().slice(0,30).forEach(r=>h+=`<div class="card"><b>${esc(r.k)}</b> · ${esc(P[r.p][0])}<div class="mu">${ago(r.ts)}${r.n?" · "+esc(r.n):""}</div></div>`);return h}
async function post(){const r={p:$("#rp").value,k:$("#rk").value,n:$("#rn").value.trim().slice(0,120),ts:Date.now()};S.msg="";
if(DB){if(!UID)S.msg="Sign in to post to the shared board.";else try{const mine=SH.filter(x=>x.u===UID).map(x=>({p:x.p,k:x.k,n:x.n,ts:x.ts}));await DB.doc("reports/"+UID).set({items:[r,...mine].slice(0,20)})}catch(e){S.msg="Could not post to the shared board. You may need Contributor access."}}
else{S.rep.unshift(r);S.rep=S.rep.slice(0,100);ls.set("ga_r",S.rep)}R()}
function saved(){if(!S.sav.length)return`<div class="card mu">No saved trips yet. Open a route on the Plan tab and tap Save.</div>`;
return S.sav.map((s,i)=>`<div class="card rt"><div><b>${esc(P[s.f][0])} → ${esc(P[s.t][0])}</b><div class="mu">${s.m}</div></div><div><button class="p" onclick="S.from='${s.f}';S.to='${s.t}';S.mode='${s.m}';S.tab='plan';R()">Go</button> <button onclick="S.sav.splice(${i},1);ls.set('ga_s',S.sav);R()" aria-label="Remove">✕</button></div></div>`).join("")}
function maps(){return`<div class="card"><b>Abuja city schematic</b>${map()}</div>`+[["Abuja Metro (light rail) line map","Pending the operator’s official file"],["FCT / AMAC bus corridors","Pending official route data"],["Abuja–Kaduna rail (Idu station)","Pending the operator’s official file"]].map(m=>`<div class="card"><b>${m[0]}</b><div class="mu">${m[1]}. Official maps are published only with the owner’s permission.</div></div>`).join("")}
function cities(){const C=["Lagos","Port Harcourt","Kano","Ibadan","Kaduna","Enugu","Benin City","Jos"];
return`<div class="card"><b>Abuja</b> <span class="tag">Live prototype</span><div class="mu">19 places, 5 travel modes, shared rider reports.</div></div><b>Vote for the next city</b>`+C.map(c=>`<div class="card rt"><div><b>${c}</b><div class="mu">${S.vote[c]||0} vote${(S.vote[c]||0)==1?"":"s"} on this device</div></div><button onclick="S.vote['${c}']=(S.vote['${c}']||0)+1;ls.set('ga_v',S.vote);R()">▲ Vote</button></div>`).join("")+`<div class="card"><b>Data partners</b><div class="mu">Each city is added as its own data pack: places, routes, fares and official maps. Transport unions, state agencies and operators are invited to supply data so times and fares can be verified.</div></div>`}
const T=[["plan","🧭","Plan"],["live","📡","Live"],["saved","★","Saved"],["maps","🗺️","Maps"],["cities","🌍","Cities"]];
function R(){$("#app").innerHTML={plan,live,saved,maps,cities}[S.tab]();$("#nav").innerHTML=T.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="S.tab='${t[0]}';R();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join("")}
R();
(async()=>{try{const [u,d]=await Promise.all([claude.use("user"),claude.use("db")]);if(!u||!d)return;UID=await u.id();DB=d;
d.collection("reports").onSnapshot(s=>{SH=[];s.docs.forEach(x=>{const it=(x.data()||{}).items;if(Array.isArray(it))it.forEach(i=>{if(i&&P[i.p]&&i.ts)SH.push({p:i.p,k:String(i.k||""),n:String(i.n||""),ts:+i.ts,u:x.id})})});SH.sort((a,b)=>b.ts-a.ts);if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))R()},()=>{DB=null;R()})}catch(e){}})();
</script></body></html>
