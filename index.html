@keyframes wCard{from{opacity:0;transform:translateY(22px) scale(.93)}to{opacity:1;transform:none}}
@keyframes wPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.wl .logo{position:absolute;left:24px;top:calc(env(safe-area-inset-top,0px) + 22px);width:30px;height:auto;z-index:6}
.wl .bar{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:6px;z-index:6}
.wl .bar i{flex:1;height:3px;border-radius:3px;background:rgba(10,10,10,.22);overflow:hidden;position:relative}
.wl .bar i b{position:absolute;inset:0;background:#0A0A0A;transform-origin:left;transform:scaleX(0)}
.wl .bar i.done b{transform:scaleX(1)}.wl .bar i.cur b{animation:wFill 5.2s linear forwards}
.wl .panel{flex:0 0 56%;min-height:0;background:#9CAF88;border-radius:0 0 44px 44px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:64px 20px 20px;cursor:pointer}
.wl .txt{padding:30px 26px 0;flex:1;min-height:0;animation:wUp .5s cubic-bezier(.2,.9,.2,1) .1s both}
.wl h1{font-size:30px;line-height:1.1;letter-spacing:-.9px;margin:0 0 10px;font-weight:700;color:#fff}
.wl p{margin:0;color:#98A18F;font-size:15px;line-height:1.5}
.wl .cta{display:block;width:calc(100% - 48px);margin:0 24px;height:56px;border-radius:99px;border:0;background:#9CAF88;color:#0A0A0A;font:700 17px system-ui,sans-serif;box-shadow:0 0 44px rgba(156,175,136,.34);transition:transform .15s,opacity .2s}
.wl .cta:active{transform:scale(.97)}
.wl .fine{text-align:center;font-size:11.5px;color:#6B7466;padding:14px 24px calc(env(safe-area-inset-bottom,0px) + 18px)}.wl .fine a{color:#B7C8A5}
.wl .stk{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
.wl .fc{display:flex;align-items:center;gap:12px;background:#12150E;color:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);animation:wCard .55s cubic-bezier(.34,1.4,.5,1) var(--d,0s) both}
.wl .fc b{display:block;font-size:15px;font-weight:600}.wl .fc small{display:block;color:#8A9382;font-size:12px;margin-top:1px}.wl .fc>div{flex:1;min-width:0}
.wl .amt{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:#fff}
.wl .mbx{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}.wl .mbx svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wl .chp{background:#12150E;color:#fff;font-size:13px;font-weight:600;border-radius:99px;padding:8px 14px;animation:wCard .5s cubic-bezier(.34,1.4,.5,1) var(--d,0s) both}
.wl .chs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:330px}
.wl .ch{display:inline-flex;align-items:center;gap:6px;background:#12150E;color:#fff;border-radius:99px;padding:8px 14px 8px 8px;font-size:13px;font-weight:600;animation:wPop .45s cubic-bezier(.34,1.56,.64,1) var(--d,0s) both}
.wl .ch .mbx{width:24px;height:24px}.wl .ch .mbx svg{width:13px;height:13px}
.wl .rc{position:relative;width:300px;height:230px;background:#12150E;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);animation:wCard .55s cubic-bezier(.34,1.4,.5,1) .15s both}
.wl .rc svg.rt{position:absolute;inset:0;width:100%;height:100%}
.wl .rc .nd{position:absolute;animation:wPop .45s cubic-bezier(.34,1.56,.64,1) var(--d) both}
.wl .rc .lb{position:absolute;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);border-radius:99px;padding:3px 9px;animation:wPop .4s ease var(--d) both}
.wl .rc .tot{position:absolute;left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#8A9382;font-size:12px;animation:wUp .5s ease 2.1s both}.wl .rc .tot b{color:#B7C8A5;font-size:18px}
.wl .rl{stroke-dasharray:1;stroke-dashoffset:1;animation:wDraw .7s ease var(--d) forwards}@keyframes wDraw{to{stroke-dashoffset:0}}
.wl .sp{position:absolute;inset:0;background:#9CAF88;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.wl .sp .dsh{opacity:0;animation:wFade .6s ease 1.8s forwards}@keyframes wFade{to{opacity:.55}}
.wl .sp .pn{position:relative;width:92px;z-index:2;transform-origin:50% 100%;animation:dropk 1.1s ease-in-out .15s both}
.wl .ascr{padding:calc(env(safe-area-inset-top,0px) + 92px) 24px calc(env(safe-area-inset-bottom,0px) + 22px);overflow-y:auto}
.wl .ascr h1{font-size:30px;margin-bottom:8px}
.wl .fld{display:flex;flex-direction:column;margin-top:26px}
.wl label{font-size:11.5px;letter-spacing:1px;font-weight:700;color:#7F887A;margin:14px 0 8px;display:block}
.wl input{width:100%;height:58px;border-radius:16px;border:1.5px solid rgba(255,255,255,.08);background:#171A14;color:#fff;font:500 16px system-ui,sans-serif;padding:0 16px;caret-color:#B7C8A5;outline:0;transition:border .2s,box-shadow .2s;min-height:0}
.wl input::placeholder{color:#5A6355}
.wl input:focus{border-color:#B7C8A5;box-shadow:0 0 0 4px rgba(156,175,136,.16)}
.wl .cta2{display:block;width:100%;height:56px;margin-top:22px;border-radius:99px;border:0;font:700 17px system-ui,sans-serif;background:#1C2018;color:#5A6355;transition:all .25s}
.wl .cta2.on{background:#9CAF88;color:#0A0A0A;box-shadow:0 0 44px rgba(156,175,136,.32)}.wl .cta2:active{transform:scale(.98)}
.wl .ob{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:12px;border-radius:99px;font:600 16px system-ui,sans-serif;border:1.5px solid rgba(255,255,255,.16);background:transparent;color:#fff}
.wl .ob.w{background:#F2F5EE;color:#0A0A0A;border-color:#F2F5EE}.wl .ob svg{width:20px;height:20px}
.wl .lnk{text-align:center;margin-top:20px;font-size:14px;color:#98A18F;line-height:1.9}.wl .lnk a{color:#fff;font-weight:600;cursor:pointer}
.wl .wm{margin-top:14px;font-size:13.5px;color:#FF9C8A;background:rgba(255,120,90,.1);border-radius:12px;padding:10px 14px}
.wl .skip{position:absolute;right:20px;top:calc(env(safe-area-inset-top,0px) + 20px);z-index:8;background:rgba(10,10,10,.8);color:#fff;border:0;border-radius:99px;padding:7px 14px;font:600 12px system-ui,sans-serif}
.wl .sent{display:flex;flex-direction:column;align-items:flex-start}
.wl .sent .ic{width:64px;height:64px;border-radius:50%;background:rgba(156,175,136,.16);display:grid;place-items:center;margin-bottom:22px;animation:wPop .5s cubic-bezier(.34,1.56,.64,1) .1s both}.wl .sent .ic svg{width:30px;height:30px;stroke:#B7C8A5;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:700px){.wl .scr{left:50%;right:auto;width:440px;transform:translateX(-50%)}.wl .scr.fresh{animation:none}.wl{background:#0A0C09}.wl .sp{width:100%;left:0}}
@media (prefers-reduced-motion:reduce){.wl *{animation-duration:.01s!important;animation-delay:0s!important}}

#splash{background:linear-gradient(180deg,#9CAF88,#AEC09C 60%,#C9D6BC)!important}

function allE(){const sk=new Set(),out=[];E.forEach(e=>{const k=ck(e[0],e[1],e[2]);if(!sk.has(k)){sk.add(k);out.push([...e,0])}});

const g={};lst("routes").forEach(x=>{if(!P[x.a]||!P[x.b]||!MD[x.m]||!(+x.f>0)||x.a===x.b||Date.now()-x.ts>1.56e10)return;const k=ck(x.a,x.b,x.m);if(sk.has(k))return;const o=g[k]=g[k]||{u:{},x};if(!o.u[x.u||"me"])o.u[x.u||"me"]=x});
for(const k in g){const us=Object.values(g[k].u),fs=us.map(x=>+x.f).sort((p,q)=>p-q),x=g[k].x;out.push([x.a,x.b,x.m,fs[fs.length>>1],String(x.note||"").slice(0,120),"crowd",us.length])}return out}

if(fm.data){LF={};fm.data.forEach(r=>{if(okK(r.k))LF[r.k]={med:r.med,n:r.n}})}
if(rs.data)SH.routes=rs.data.filter(r=>P[r.a]&&P[r.b]&&MD[r.m]).map(r=>({a:r.a,b:r.b,m:r.m,f:r.fare,note:r.note,n:r.n}));

function startWelcome(step){clearTimeout(WTM);const er=window.__AUTHERR||"";window.__AUTHERR="";W={step:er?"auth":(step||"splash"),i:0,mode:er?"in":"up",n:"",e:"",msg:er,busy:0,sent:""};document.body.style.overflow="hidden";renderWelcome()}
function closeWelcome(){clearTimeout(WTM);W=null;const el=$("#wl");if(el)el.remove();document.body.style.overflow=S.ok!=null?"hidden":""}
function wGo(step){clearTimeout(WTM);W.step=step;if(step==="auth")W.msg="";renderWelcome()}
function wTap(e){const r=e.currentTarget.getBoundingClientRect();clearTimeout(WTM);if(e.clientX>r.left+r.width/2){if(W.i<SLIDES.length-1)W.i++}else if(W.i>0)W.i--;renderWelcome(1)}
function wMode(m){W.mode=m;W.msg="";renderWelcome(1)}
function wValid(){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(W.e.trim())&&(W.mode==="in"||W.n.trim().length>=2)}
function wv(){const b=$("#w-c");if(b)b.classList.toggle("on",wValid())}
function wHelp(){W.msg="Check your spam folder, make sure the email is right, or try Continue with Google.";renderWelcome(1)}
function wSkip(){sessionStorage.setItem("gc_skip","1");closeWelcome();document.body.classList.remove("locked")}
async function wSubmit(e){e.preventDefault();if(document.activeElement)document.activeElement.blur();
if(!wValid()){W.msg=W.mode==="up"?"Please enter your name and a valid email.":"Please enter a valid email.";renderWelcome(1);return false}
if(!sb){W.msg="Preview only: sign-in works on the live site.";renderWelcome(1);return false}
W.busy=1;W.msg="";renderWelcome(1);const nm=W.n.trim(),{error}=await sb.auth.signInWithOtp({email:W.e.trim(),options:{shouldCreateUser:true,data:W.mode==="up"&&nm?{full_name:nm}:undefined,emailRedirectTo:location.origin+location.pathname}});
W.busy=0;if(error)W.msg="Could not send the link. Check the email and try again.";else{W.sent=W.e.trim();W.step="sent"}renderWelcome(error?1:0);return false}
async function woauth(p){if(!sb){W.msg="Preview only: sign-in works on the live site.";renderWelcome(1);return}await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}})}
function counts(){const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;document.querySelectorAll("#wl .amt").forEach(e=>{const n=+e.dataset.n,d=+e.dataset.d*1000+250;if(rm){e.textContent=N(n);return}setTimeout(()=>{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=N(n*(1-Math.pow(1-k,3)));if(k<1&&document.body.contains(e))requestAnimationFrame(f)})(t0)},d)})}
const splashHTML=()=>`<div class="sp"><img class="pn" src="${WPIN}" alt="Logo"></div>`;
const finePrint='<div class="fine">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</div>';
function introHTML(f){const s=SLIDES[W.i];return`<div class="scr${f}"><div class="bar">${SLIDES.map((_,k)=>`<i class="${k<W.i?"done":k===W.i?"cur":""}"><b></b></i>`).join("")}</div><img class="logo" src="${WPIN}" alt="Logo"><div class="panel" onclick="wTap(event)">${s.p()}</div><div class="txt"><h1>${s.t}</h1><p>${s.d}</p></div><button class="cta" onclick="wGo('auth')">Get started</button>${finePrint}</div>`}
function authHTML(f){const up=W.mode==="up",foc="setTimeout(()=>this.scrollIntoView({block:'center',behavior:'smooth'}),260)";return`<div class="scr${f} ascr"><img class="logo" src="${WLIME}" alt="Logo"><h1>${up?"Create your account":"Welcome back"}</h1><p>${up?"Enter your name and email. We’ll send you a link to sign in.":"Enter your email and we’ll send you a link to sign in."}</p>
<form onsubmit="return wSubmit(event)" novalidate><div class="fld">${up?`<label for="w-n">NAME</label><input id="w-n" autocomplete="name" placeholder="Your name" value="${esc(W.n)}" oninput="W.n=this.value;wv()" onfocus="${foc}">`:""}<label for="w-e">EMAIL</label><input id="w-e" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com" value="${esc(W.e)}" oninput="W.e=this.value;wv()" onfocus="${foc}"></div>${W.msg?`<div class="wm">${esc(W.msg)}</div>`:""}<button id="w-c" class="cta2 ${wValid()?"on":""}" ${W.busy?"disabled":""}>${W.busy?"Sending…":"Continue"}</button></form>
<button class="ob w" onclick="woauth('apple')">${APPLE}Continue with Apple</button><button class="ob" onclick="woauth('google')">${GOOGLE}Continue with Google</button>
<div class="lnk">${up?`Already have an account? <a onclick="wMode('in')">Log in</a>`:`New here? <a onclick="wMode('up')">Create an account</a>`}<br><a onclick="wHelp()">Trouble signing in?</a></div>${finePrint}</div>`}
const sentHTML=f=>`<div class="scr${f} ascr"><img class="logo" src="${WLIME}" alt="Logo"><div class="sent"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div><h1>Check your email</h1><p>We sent a sign-in link to <b style="color:#fff">${esc(W.sent)}</b>. Open it on this device to continue.</p></div><button class="ob" style="margin-top:28px" onclick="W.sent='';wGo('auth')">Use a different email</button><div class="fine">Can’t find it? Check your spam folder.</div></div>`;
function renderWelcome(k){let el=$("#wl");if(!W){if(el)el.remove();return}if(!el){el=document.createElement("div");el.id="wl";el.className="wl";document.body.appendChild(el)}
const f=k?"":" fresh";el.innerHTML=(W.step==="splash"?splashHTML():W.step==="intro"?introHTML(f):W.step==="sent"?sentHTML(f):authHTML(f))+(!sb?'<button class="skip" onclick="wSkip()">Skip preview</button>':"");clearTimeout(WTM);
if(W.step==="splash")WTM=setTimeout(()=>{if(W&&W.step==="splash")wGo("intro")},2300);
if(W.step==="intro"){counts();if(W.i<SLIDES.length-1)WTM=setTimeout(()=>{if(W&&W.step==="intro"){W.i++;renderWelcome(1)}},5300)}}
function gate(){if(!sb)return;if(SESSION){document.body.classList.remove("locked");if(W)closeWelcome()}else{document.body.classList.add("locked");if(!W)startWelcome(ls.get("gc_in",0)?"auth":"intro")}}
function openAuth(mode){if(!W)startWelcome(ls.get("gc_in",0)||mode==="in"?"auth":"intro")}
